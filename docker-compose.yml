services:
  postgres:
    image: postgres:15-alpine
    container_name: crea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crea_db}
      POSTGRES_USER: ${POSTGRES_USER:-crea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - dokploy-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-crea} -d ${POSTGRES_DB:-crea_db}
      interval: 10s
      timeout: 5s
      retries: 5
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: crea_hermes
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HERMES_HOME=/opt/data
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-crea_db}
      - POSTGRES_USER=${POSTGRES_USER:-crea}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_HOME_CHANNEL=${TELEGRAM_HOME_CHANNEL:-}
      - FB_PAGE_ACCESS_TOKEN=${FB_PAGE_ACCESS_TOKEN:-}
      - FB_PAGE_ID=${FB_PAGE_ID:-}
      - FB_API_VERSION=${FB_API_VERSION:-v18.0}
    volumes:
      - hermes_data:/opt/data
      - shared_img:/output/img
      - shared_audio:/output/audio
    command: ["hermes", "gateway"]
    healthcheck:
      test: ["CMD", "hermes", "doctor"]
      interval: 60s
      timeout: 10s
      retries: 3

  web:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
    depends_on:
      postgres:
        condition: service_healthy
      hermes:
        condition: service_started
    volumes:
      - shared_img:/usr/share/nginx/html/apps/web/assets/img/generated
      - shared_audio:/usr/share/nginx/html/apps/web/assets/audio
    labels:
      - traefik.http.routers.test-crea-7ahi34-2-web.rule=Host(`crea-contenidos.com`)
      - traefik.http.routers.test-crea-7ahi34-2-web.entrypoints=web
      - traefik.http.services.test-crea-7ahi34-2-web.loadbalancer.server.port=80
      - traefik.http.routers.test-crea-7ahi34-2-web.service=test-crea-7ahi34-2-web
      - traefik.http.routers.test-crea-7ahi34-2-web.middlewares=redirect-to-https@file
      - traefik.http.routers.test-crea-7ahi34-2-websecure.rule=Host(`crea-contenidos.com`)
      - traefik.http.routers.test-crea-7ahi34-2-websecure.entrypoints=websecure
      - traefik.http.services.test-crea-7ahi34-2-websecure.loadbalancer.server.port=80
      - traefik.http.routers.test-crea-7ahi34-2-websecure.service=test-crea-7ahi34-2-websecure
      - traefik.http.routers.test-crea-7ahi34-2-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
      - traefik.http.routers.crea-web.rule=Host(`crea-contenidos.com`) || Host(`www.crea-contenidos.com`)
      - traefik.http.routers.crea-web.entrypoints=web,websecure
      - traefik.http.routers.crea-web.tls.certresolver=letsencrypt
      - traefik.http.services.crea-web.loadbalancer.server.port=80
      - traefik.docker.network=dokploy-network
    environment:
      - PHP_MEMORY_LIMIT=256M
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-crea_db}
      - POSTGRES_USER=${POSTGRES_USER:-crea}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - JWT_SECRET=${JWT_SECRET:-change_me}

volumes:
  postgres_data:
  hermes_data:
  shared_img:
  shared_audio:

networks:
  dokploy-network:
    external: true
